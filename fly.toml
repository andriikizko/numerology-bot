# Fly.io configuration for Numerology Bot

app = "numerology-bot"
primary_region = "iad"

[build]
  builder = "heroku"
  buildpacks = ["heroku/nodejs"]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[processes]
  app = "cd bot && npm start"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]
  
  [services.http_checks]
    enabled = false

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
